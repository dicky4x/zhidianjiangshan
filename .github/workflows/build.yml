name: Build KeyHint (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build main app
        run: python -m PyInstaller --noconfirm --distpath build/dist --workpath build/build installer/KeyHint.spec

      - name: Build installer and portable package
        run: python installer/build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyHint-Windows
          path: 安装包/*
          if-no-files-found: error
